<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>V8 Transparent Engine Simulator</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V8 Engine">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#07080c;--panel:#13151c;--line:#2c303c;--txt:#f1f3f8;--mut:#8a91a3;--cyan:#38b8ff;--red:#ff4b3e;--green:#31e07a;--amber:#f5b400;--btn:#12141b;--vp:radial-gradient(ellipse at 50% 45%,#161b29 0%,#0a0b11 72%)}
body.light{--bg:#e8ecf2;--panel:#ffffff;--line:#c4cad7;--txt:#10131a;--mut:#5d6477;--btn:#ffffff;--vp:radial-gradient(ellipse at 50% 45%,#ffffff 0%,#d9e0ea 78%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;color:inherit}
#app{position:relative;max-width:520px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 12px max(4px,env(safe-area-inset-bottom));background:var(--bg)}
.head{display:flex;align-items:center;gap:10px;flex:none}
.eng-ico{width:58px;flex:none;color:var(--mut)}
.head .t{flex:1;min-width:0}
.head h1{margin:0;font-size:21px;line-height:1.15;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head p{margin:2px 0 0;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap{background:none;border:0;width:34px;height:34px;display:grid;place-items:center;color:var(--mut);cursor:pointer;flex:none}
.circ{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--btn);display:grid;place-items:center;cursor:pointer;flex:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:9px 0 5px;flex:none}
.tb{height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.07em;cursor:pointer}
.tb.on{border-color:var(--cyan);color:var(--cyan);background:rgba(56,184,255,.1)}
.tb.rec.on{border-color:var(--red);color:var(--red);background:rgba(255,75,62,.12)}
.stat{display:flex;align-items:center;gap:14px;font-size:12.5px;font-weight:600;margin:3px 4px;flex:none;white-space:nowrap;overflow:hidden}
.stat span{display:flex;align-items:center;gap:5px}
.leds{display:flex;align-items:center;gap:clamp(4px,1.6vw,8px);padding:5px 8px 2px;flex:none}
.rbar{position:relative;flex:1;min-width:0;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.07);border:1px solid var(--line)}
body.light .rbar{background:rgba(0,0,0,.06)}
.rfill{position:absolute;inset:0;clip-path:inset(0 100% 0 0)}
.rbar.fl .rfill{opacity:.4}
.rtick{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.5)}
.rred{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.6}
.cut{margin-left:4px;border:1.5px solid var(--red);color:var(--red);font-size:11px;font-weight:600;padding:3px 6px;border-radius:5px;opacity:.55;letter-spacing:.08em}
.cut.on{background:var(--red);color:#fff;opacity:1}
.flame{color:var(--amber);opacity:.3;margin-left:6px;display:grid}
.flame.on{opacity:1;filter:drop-shadow(0 0 5px var(--amber))}
.snap{margin-left:auto;margin-right:6px;background:none;border:0;display:grid;color:var(--txt);cursor:pointer}
.vp{position:relative;flex:1;min-height:170px;margin:2px -12px;background:var(--vp);overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:16px;top:8px;pointer-events:none}
.r1{display:flex;align-items:center;gap:10px}
.gbox{min-width:36px;height:36px;border:1.5px solid var(--red);border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:20px;padding:0 6px}
.gbox.in{border-color:var(--cyan)}
.rpm{font-weight:800;font-size:34px;line-height:1;color:var(--red);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.rpm small{font-size:12px;color:var(--mut);font-weight:600;margin-left:5px;font-family:Inter,system-ui,sans-serif}
.r2{margin-top:6px;display:flex;gap:14px;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.r2 small{font-size:12px;color:var(--mut);font-weight:600;margin-left:3px}
.r2 .bar{color:var(--cyan)}
.r3{margin-top:5px;font-size:12px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
.gbinfo{margin-top:4px;font-size:12px;color:var(--cyan);font-weight:700;display:none}
.vbtn{position:absolute;bottom:10px;width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:rgba(16,18,25,.6);display:grid;place-items:center;cursor:pointer;color:var(--txt)}
body.light .vbtn{background:rgba(255,255,255,.7)}
.vbtn.on{border-color:var(--cyan);color:var(--cyan)}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(18,20,28,.94);color:#fff;border:1px solid #333847;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:3}
.toast.show{opacity:1}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border:1px solid var(--line);border-radius:16px;background:var(--btn);padding:4px;margin:7px 0;flex:none}
.seg button{height:42px;border:0;border-radius:12px;background:none;font-size:14px;white-space:nowrap;font-weight:600;cursor:pointer}
.seg button.on{background:#e53b2d;color:#fff}
.ctl{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:10px;height:clamp(140px,24vh,225px);flex:none}
.pedal{position:relative;border:1.5px solid var(--line);border-radius:22px;background:var(--btn);overflow:hidden;touch-action:none;cursor:ns-resize}
.pedal .gr{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(128,140,170,.1) 9px 10px)}
.pedal .fill{position:absolute;left:0;right:0;bottom:0;height:0}
.gas .fill{background:linear-gradient(to top,rgba(49,224,122,.12),rgba(49,224,122,.5))}
.brake .fill{background:linear-gradient(to top,rgba(255,75,62,.12),rgba(255,75,62,.5))}
.pedal .pct{position:absolute;top:8px;left:0;right:0;text-align:center;font-weight:700;font-size:19px;color:var(--mut)}
.pedal .lev{position:absolute;left:0;right:0;bottom:38px;display:grid;place-items:center}
.gas .lev{color:var(--green)}.brake .lev{color:var(--red)}
.pedal .lbl{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:700;letter-spacing:.16em;font-size:17px;color:var(--mut)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;min-height:0}
.start{flex:1;min-height:0;aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#262a34,#0e1015);border:5px solid #cdd0d8;position:relative;display:grid;place-items:center;cursor:pointer;padding:0}
body.light .start{background:radial-gradient(circle at 50% 40%,#3a3f4c,#161920);color:#fff}
.start::after{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid var(--amber);transition:.2s}
.start.run::after{border-color:var(--green);box-shadow:0 0 16px rgba(49,224,122,.55)}
.start .tx{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.05;color:#fff}
.start .tx i{font-style:normal;font-size:10px;letter-spacing:.2em;color:#9aa1b2}
.start .tx b{font-size:clamp(15px,3.6vw,22px);letter-spacing:.06em;opacity:.45}
.start .tx b.act{opacity:1}
.start .tx hr{width:70%;border:0;border-top:1px solid #444a58;margin:2px 0}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;height:34%;flex:none}
.pm button{border:1.5px solid var(--line);border-radius:18px;background:var(--btn);display:grid;place-items:center;cursor:pointer;padding:0}
.pm button:active,.tb:active,.circ:active{filter:brightness(1.4)}
.nav{display:grid;grid-template-columns:repeat(6,1fr);flex:none;margin:6px -12px 0;padding:5px 6px 1px;border-top:1px solid var(--line);background:var(--panel)}
.nv{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:600;padding:2px 0;cursor:pointer}
.nv .pill{width:58px;height:38px;border-radius:19px;display:grid;place-items:center}
.nv.on{color:var(--txt)}
.nv.on .pill{background:rgba(229,59,45,.22);color:var(--red)}
.sheet{position:absolute;left:12px;right:12px;bottom:78px;max-height:62%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:none;z-index:6;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.sheet.show{display:block}
.sheet h3{margin:0 0 10px;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--btn);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(56,184,255,.1)}
.sheet input[type=range]{width:150px;accent-color:#38b8ff}
.ratios{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;font-size:12px;color:var(--mut);margin-top:6px}
.ratios b{display:block;color:var(--txt);font-size:15px}
#app.imm .head,#app.imm .tabs,#app.imm .seg{display:none}
@media (max-height:700px){.tb{height:50px}.nv .pill{height:32px}.seg button{height:36px}}
.r4{margin-top:3px;font-size:12px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--mut);margin:6px 0 8px;line-height:1.4}
.prow{padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.prow small{display:block;color:var(--mut);font-size:12px;margin:2px 0 7px}
.tsum{margin:8px 0;padding:9px 11px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.tsum small{display:inline;margin-left:8px;color:var(--mut);font-size:12px}
.wtag{display:inline-block;margin:6px 5px 0 0;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700}
.wtag.bad{background:rgba(255,75,62,.18);color:var(--red)}
.wtag.mid{background:rgba(245,180,0,.18);color:var(--amber)}
.wtag.ok{background:rgba(49,224,122,.16);color:var(--green)}
.mapcv{width:100%;display:block;touch-action:none;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:rgba(128,140,170,.06)}
.carui{display:none}
#app.car .carui{display:grid}
.vbtn.cl1{left:76px}.vbtn.cl2{left:136px}.vbtn.cr1{right:76px}
.attr{position:absolute;right:8px;top:6px;max-width:44%;font-size:9px;line-height:1.25;color:var(--mut);text-align:right;pointer-events:none;display:none;opacity:.8}
#app.car .attr{display:block}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <svg class="eng-ico" viewBox="0 0 130 66" fill="none" stroke="currentColor" stroke-width="3.5"><g><rect x="4" y="6" width="26" height="15" rx="7.5"/><rect x="36" y="6" width="26" height="15" rx="7.5"/><rect x="68" y="6" width="26" height="15" rx="7.5"/><rect x="100" y="6" width="26" height="15" rx="7.5"/></g><path d="M2 33h126" stroke-dasharray="4 6" stroke-width="2"/><g><rect x="10" y="44" width="26" height="15" rx="7.5"/><rect x="42" y="44" width="26" height="15" rx="7.5"/><rect x="74" y="44" width="26" height="15" rx="7.5"/><rect x="106" y="44" width="22" height="15" rx="7.5"/></g></svg>
    <div class="t"><h1 id="ename">Supercharged V8 6.2</h1><p id="esub"></p></div>
    <button class="swap" id="swap" aria-label="Next engine"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/></svg></button>
    <button class="circ" id="theme" aria-label="Theme"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
  <div class="tabs">
    <button class="tb rec" id="tRec"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/></svg>REC</button>
    <button class="tb" id="tSound"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>SOUND</button>
    <button class="tb" id="tGear"><svg width="30" height="26" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1.5" y="5" width="12" height="14" rx="7"/><rect x="16.5" y="5" width="12" height="14" rx="7"/><path d="M5 12h5M22.5 9v6M20 12h5"/></svg>GEARBOX</button>
    <button class="tb on" id="tTunnel"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 21v-9a8.5 8.5 0 0 1 17 0v9"/><path d="M7.5 21v-9a4.5 4.5 0 0 1 9 0v9"/><path d="M12 21v-9"/></svg>TUNNEL</button>
    <button class="tb on" id="tVib"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="3" width="9" height="18" rx="2"/><path d="M3.5 8v8M20.5 8v8M1 10.5v3M23 10.5v3"/></svg>VIBRATION</button>
  </div>
  <div class="stat">
    <span style="color:var(--cyan)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM7 13h.01M17 13h.01"/></svg>SIM</span>
    <span style="color:var(--green)"><svg width="16" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg><i id="stFps" style="font-style:normal">60 fps</i></span>
    <span style="color:var(--mut)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><i id="stLoad" style="font-style:normal;color:var(--txt)">Load 0%</i></span>
  </div>
  <div class="leds" id="leds"><span class="cut" id="cut">CUT</span>
    <span class="flame" id="flame"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg></span>
    <button class="snap" id="snap" aria-label="Snapshot"><svg width="30" height="26" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="5" width="17" height="14" rx="3.5"/><path d="M19 10l8-4v12l-8-4z"/></svg></button></div>
  <div class="vp" id="vp">
    <canvas id="c"></canvas>
    <div class="hud">
      <div class="r1"><div class="gbox" id="gbox">N</div><div class="rpm"><span id="rpm">0</span><small>RPM</small></div></div>
      <div class="r2"><span><i id="kmh" style="font-style:normal">0</i><small>km/h</small></span><span class="bar"><i id="bar" style="font-style:normal">0,00</i><small style="color:var(--cyan)">bar</small></span></div>
      <div class="r3" id="pw"></div>
      <div class="r4" id="tuneHud"></div>
      <div class="gbinfo" id="gbinfo"></div>
    </div>
    <button class="vbtn on" id="slow" style="left:16px" aria-label="Slow motion"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8L4 8.5"/><path d="M4 4v4.5h4.5M12 8v4.5l3 1.8"/></svg></button>
    <button class="vbtn" id="full" style="right:16px" aria-label="Immersive"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <div class="toast" id="toast"></div>
  </div>
  <div class="seg" id="seg"><button data-m="live">Live drive</button><button data-m="sim" class="on">Drive sim</button><button data-m="garage">Garage rev</button><button data-m="car">Car drive</button></div>
  <div class="ctl">
    <div class="pedal brake" id="pBrake"><div class="gr"></div><div class="fill"></div><div class="pct">0%</div><div class="lev"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M8 20l-3-1 4-9-2-1 .8-1.7 4.2 1.9-.9 2L17 9.5l-1.5-3L17.3 5.6 20 11l-12 9z" opacity=".95"/><circle cx="8.5" cy="5" r="1.7"/></svg></div><div class="lbl">BRAKE</div></div>
    <div class="mid">
      <button class="start" id="start"><div class="tx"><i>ENGINE</i><b id="bStart" class="act">START</b><hr><b id="bStop">STOP</b></div></button>
      <div class="pm"><button id="dn" aria-label="Downshift"><svg width="32" height="32" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg></button><button id="up" aria-label="Upshift"><svg width="32" height="32" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button></div>
    </div>
    <div class="pedal gas" id="pGas"><div class="gr"></div><div class="fill"></div><div class="pct">0%</div><div class="lev"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M8 20l-3-1 4-9-2-1 .8-1.7 4.2 1.9-.9 2L17 9.5l-1.5-3L17.3 5.6 20 11l-12 9z" opacity=".95"/><circle cx="8.5" cy="5" r="1.7"/></svg></div><div class="lbl">GAS</div></div>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="nav" id="nav">
    <button class="nv on" data-t="dash"><div class="pill"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 18a8.5 8.5 0 1 1 15 0"/><path d="M12 14l3.5-5"/><circle cx="12" cy="14" r="1.2" fill="currentColor"/></svg></div>Dash</button>
    <button class="nv" data-t="garage"><div class="pill"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10l9-6 9 6v10H3z"/><path d="M7 20v-7h10v7M7 16h10"/></svg></div>Garage</button>

  if(S.run&&G.bf&&G.lim===2&&S.cut>0){BF.limT-=dt;if(BF.limT<=0){BF.q.push({t:0,k:0.7+0.3*Math.random()});BF.limT=0.08+Math.random()*0.12;}}else BF.limT=0;
  for(let i=BF.q.length-1;i>=0;i--){const e=BF.q[i];e.t-=dt;if(e.t<=0){fireBackfire(e.k);BF.q.splice(i,1);}}

  let any=false,peak=0;

 {name:'Stock',fb:0.40,kd:0.32,len:[0.0072,0.0078],lp:3800,boom:3,rasp:1.0,crack:0.6,popMul:0.35,body:[1,0.85,0.5,0.25]},

function satCurve(k){const n=1024,c=new Float32Array(n),d=Math.tanh(k*2.2);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*2.2*x)/d;}return c;}

  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;
    for(let i=0;i<n;i++){const t=i/n;lp+=((Math.random()*2-1)-lp)*(0.55-0.4*t);d[i]=lp*Math.pow(1-t,dec);}}
  return b;}
function applyRoom(){if(!nodes)return;const r=ROOMS[G.room]||ROOMS[1];
  if(!nodes.ir[G.room])nodes.ir[G.room]=makeIR(r.sec,r.dec);
  try{nodes.send.disconnect(nodes.conv);nodes.conv.disconnect();}catch(e){}
  const cv=AC.createConvolver();cv.buffer=nodes.ir[G.room];nodes.send.connect(cv);cv.connect(nodes.wet);nodes.conv=cv;
  nodes.wet.gain.setTargetAtTime(r.wet,AC.currentTime,0.05);}

  nodes.sat.forEach(s=>{s.curve=satCurve(P.rasp);});
  nodes.pk.forEach(p=>p.gain.setTargetAtTime(P.boom,AC.currentTime,0.05));}

  try{AC=new Ctx({latencyHint:'interactive'});}catch(e){try{AC=new Ctx();}catch(e2){return;}}
  const sr=AC.sampleRate,dts=1/sr;
  const bq=(type,f,q,g)=>{const n=AC.createBiquadFilter();n.type=type;n.frequency.value=f;if(q!==undefined)n.Q.value=q;if(g!==undefined)n.gain.value=g;return n;};
  const gn=v=>{const n=AC.createGain();n.gain.value=v;return n;};

  const bus=gn(1),comp=AC.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=0.004;comp.release.value=0.14;
  gainNode=gn(1);bus.connect(comp);comp.connect(gainNode);gainNode.connect(AC.destination);
  const send=gn(1);bus.connect(send);const wet=gn(0.2);wet.connect(comp);
  nodes={sat:[],pk:[],lp:[],ir:[],conv:null,send,wet};
  const sp=AC.createScriptProcessor(2048,0,3);
  const split=AC.createChannelSplitter(3);sp.connect(split);
  [0,1].forEach(b=>{
    const hp=bq('highpass',30,0.7),ls=bq('lowshelf',150,0.7,5),pk=bq('peaking',108,1.3,4),nt=bq('peaking',1000,0.9,-3);
    const pre=gn(0.35),sat=AC.createWaveShaper();sat.oversample='2x';

    let last=og;

    last.connect(bus);nodes.sat.push(sat);nodes.pk.push(pk);nodes.lp.push(lp);});

  /* ---- synthesis ---- */
  /* band-pass resonator, normalised so a unit impulse rings with peak ~1 */
  function mkRes(fc,tau){const th=TAU*fc/sr,r=Math.exp(-1/(tau*sr)),c1=2*r*Math.cos(th),c2=-r*r;
    let y1=0,y2=0,x1=0,x2=0,mx=1e-9;const N=Math.min(20000,Math.ceil(sr*tau*1.5));
    for(let n=0;n<N;n++){const x=n===0?1:0,y=(x-x2)+c1*y1+c2*y2;x2=x1;x1=x;y2=y1;y1=y;if(Math.abs(y)>mx)mx=Math.abs(y);}

const TUNE={st:null,mul:new Float32Array(2),knk:new Float32Array(2),step:50,dyn:1,temp:30,kn:0,warn:[],ready:false};
let TUNEDB={sel:0,eng:{}},tuneDirty=false,tsub='parts',mapKind='ign';
function newTune(){const z=()=>[0,0,0,0,0,0];return{parts:{intake:0,exhaust:0,cam:0,boost:0,inj:0,cool:0,int:0,fly:0},maps:{ign:z(),fuel:z(),boost:z()},limit:0,health:100};}
TUNE.st=newTune();
function normTune(raw){const t=newTune();if(!raw||typeof raw!=='object')return t;
  try{Object.keys(t.parts).forEach(k=>{const v=raw.parts?+raw.parts[k]:-1;if(v>=0&&v<=3)t.parts[k]=v|0;});
    ['ign','fuel','boost'].forEach(k=>{const a=raw.maps&&raw.maps[k];if(Array.isArray(a)&&a.length===6)t.maps[k]=a.map(x=>clamp(+x||0,MAPDEF[k].min,MAPDEF[k].max));});

function loadTuneDB(){try{const r=JSON.parse(localStorage.getItem('v8sim.tune')||'null');if(r&&typeof r==='object'&&r.eng)TUNEDB={sel:+r.sel||0,eng:r.eng};}catch(e){}

/* ---- model ---- */
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function spool(rpm,kind){return kind==='turbo'?smooth(1100,3000,rpm):(0.35+0.65*Math.min(1,rpm/4500));}
function mapAt(st,kind,rpm){const a=st.maps[kind],x=clamp(rpm/preset.limit0,0,2);
  if(x<=MAPBP[0])return a[0];
  for(let i=1;i<MAPBP.length;i++){if(x<=MAPBP[i]){const t=(x-MAPBP[i-1])/(MAPBP[i]-MAPBP[i-1]);return a[i-1]+(a[i]-a[i-1])*t;}}
  return a[a.length-1];}
function boostFull(st,rpm){const base=Math.max(0,preset.boost),add=0.2*st.parts.boost;
  if(base+add<=0.0001)return 0;

function boostBar(rpm){const st=TUNE.st,base=Math.max(0,preset.boost),add=0.2*st.parts.boost;

function safeLimit(){return preset.limit0*(1.03+0.03*TUNE.st.parts.int);}
/* torque multiplier + knock index at full throttle for a given rpm */
function calcAt(st,rpm){
  const L=st.parts,x=clamp(rpm/preset.limit0,0,1.3);
  let m=1;
  m*=1+0.02*L.intake*(0.4+0.6*x);
  m*=1+0.016*L.exhaust*(0.3+0.7*x);
  m*=1+0.035*L.cam*(2*x-0.9);
  const b=boostFull(st,rpm),b0=Math.max(0,preset.boost)*spool(rpm,preset.kind);
  m*=(1+0.95*b)/(1+0.95*b0);

  const bSafe=Math.max(0,preset.boost)+0.12+0.22*L.int+0.12*L.cool;
  const over=Math.max(0,b-bSafe);
  const advLim=3-3*Math.max(0,b-b0)+1.5*L.cool+0.5*L.int;
  let kn=0.25*Math.max(0,dg-advLim)+1.4*over+0.15*Math.max(0,-F)*(1+b);
  if(lean)kn+=3*(demand/cap-1)+0.15;

  const st=TUNE.st,lim=preset.limit0,n=Math.ceil(lim*1.4/TUNE.step)+2;

    if(r>=1500&&r<=lim*1.02){if(c.kn>maxK)maxK=c.kn;if(c.lean)lean=true;if(c.over)over=true;if(c.m>mPeak)mPeak=c.m;}}

  if(over)w.push({t:'Boost above the safe level',c:maxK>0.7?'bad':'mid'});
  if(lean)w.push({t:'Fuel system is the limit: add injectors',c:'mid'});
  if(eq>118)w.push({t:'Will overheat under load',c:'bad'});else if(eq>108)w.push({t:'Runs hot under load',c:'mid'});

  }else if(tsub==='ecu'){
    const d=MAPDEF[mapKind];
    h+='<div class="chips" style="margin-top:6px">'+Object.keys(MAPDEF).map(k=>chip('mapsel',MAPDEF[k].n,mapKind===k,k)).join('')+chip('mapreset','Reset map',false)+'</div>'+
       '<canvas id="mapcv" class="mapcv"></canvas><div class="note">'+d.hint+' Drag the dots up or down. The amber line is the live rpm.</div>';
    if(mapKind==='boost'&&preset.kind==='na'&&L.boost===0)h+='<div class="note">This engine has no forced induction. Add a supercharger kit in Parts first.</div>';
  }else{
    h+='<canvas id="dynocv" class="mapcv"></canvas><div class="note">Solid = your tune, dashed = stock. Red dots mark knock. The dashed red line is your rev limit.</div>'+
       '<div class="row"><div>Engine health<small>'+Math.round(st.health)+'%</small></div>'+chip('repair','Repair',false)+'</div>';
  }
  return h;}
function dynoData(){const lim=Math.round(preset.limit0*1.15/100)*100,o={r:[],ts:[],ps:[],tt:[],pt:[],kn:[],pS:0,tS:0,pT:0,tT:0};
  for(let r=500;r<=lim;r+=100){const ts=tq(r),k=tableAt(TUNE.knk,r),tt=ts*tuneMul(r)*(1-0.3*clamp((k-0.35)/0.65,0,1));
    const ps=ts*r/RPM/745.7,pt=tt*r/RPM/745.7;
    o.r.push(r);o.ts.push(ts);o.tt.push(tt);o.ps.push(ps);o.pt.push(pt);o.kn.push(k);
    if(r<=preset.limit){if(ps>o.pS)o.pS=ps;if(pt>o.pT)o.pT=pt;if(ts>o.tS)o.tS=ts;if(tt>o.tT)o.tT=tt;}}
  return o;}
function updateTsum(){const e=document.getElementById('tsum');if(!e)return;const d=dynoData(),pc=d.pS>0?Math.round((d.pT/d.pS-1)*100):0;
  e.innerHTML='<b>'+Math.round(d.pT)+' hp · '+Math.round(d.tT)+' Nm</b><small>stock '+Math.round(d.pS)+' hp · '+Math.round(d.tS)+' Nm · '+(pc>=0?'+':'')+pc+'%</small><div>'+
    TUNE.warn.map(w=>'<span class="wtag '+w.c+'">'+w.t+'</span>').join('')+'</div>';}
function cvSetup(cv,h){const dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(200,cv.clientWidth||300);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';return{w:w,h:h,dpr:dpr};}
function tuneAfterRender(){updateTsum();if(tsub==='ecu')setupMapCanvas();else if(tsub==='dyno')drawDyno();}

/* ---- dyno chart ---- */
function drawDyno(){const cv=document.getElementById('dynocv');if(!cv)return;
  const g=cvSetup(cv,210),ctx=cv.getContext('2d'),d=dynoData();ctx.setTransform(g.dpr,0,0,g.dpr,0,0);
  const w=g.w,h=g.h,pl=10,pr=10,pt=26,pb=26,xmin=500,xmax=d.r[d.r.length-1];
  const X=r=>pl+(r-xmin)/(xmax-xmin)*(w-pl-pr);
  const mT=Math.max.apply(null,d.tt.concat(d.ts))*1.1,mP=Math.max.apply(null,d.pt.concat(d.ps))*1.1;
  const YT=v=>h-pb-v/mT*(h-pt-pb),YP=v=>h-pb-v/mP*(h-pt-pb);
  const mut='#8a91a3',ln=G.light?'#c4cad7':'#2c303c';
  ctx.clearRect(0,0,w,h);ctx.font='11px sans-serif';ctx.textAlign='center';ctx.lineWidth=1;
  for(let r=1000;r<=xmax;r+=1000){ctx.strokeStyle=ln;ctx.beginPath();ctx.moveTo(X(r),pt);ctx.lineTo(X(r),h-pb);ctx.stroke();ctx.fillStyle=mut;ctx.fillText((r/1000)+'k',X(r),h-pb+15);}
  const line=(arr,Y,col,dash,wd)=>{ctx.setLineDash(dash);ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.beginPath();arr.forEach((v,i)=>{const x=X(d.r[i]),y=Y(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ctx.setLineDash([]);};
  line(d.ts,YT,'#38b8ff88',[5,4],2);line(d.ps,YP,'#f5b40088',[5,4],2);
  line(d.tt,YT,'#38b8ff',[],3);line(d.pt,YP,'#f5b400',[],3);
  d.kn.forEach((k,i)=>{if(k>0.35){ctx.fillStyle='#ff4b3e';ctx.beginPath();ctx.arc(X(d.r[i]),YT(d.tt[i]),3.5,0,TAU);ctx.fill();}});
  if(preset.limit>=xmin&&preset.limit<=xmax){ctx.strokeStyle='#ff4b3e';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(X(preset.limit),pt);ctx.lineTo(X(preset.limit),h-pb);ctx.stroke();ctx.setLineDash([]);}
  ctx.textAlign='left';ctx.fillStyle='#38b8ff';ctx.fillText('Torque (Nm)',pl+2,14);ctx.fillStyle='#f5b400';ctx.fillText('Power (hp)',pl+90,14);}

/* ---- ECU map editor ---- */
const MAPUI={cv:null,w:300,h:190,dpr:1,act:-1,pl:36,pr:14,pt:24,pb:30};
function mapX(i){return MAPUI.pl+i*(MAPUI.w-MAPUI.pl-MAPUI.pr)/5;}
function mapFromY(y){const d=MAPDEF[mapKind],g=MAPUI;if(g.act<0)return;
  let v=d.max-(y-g.pt)/(g.h-g.pt-g.pb)*(d.max-d.min);v=clamp(Math.round(v/d.step)*d.step,d.min,d.max);
  const a=TUNE.st.maps[mapKind];if(a[g.act]!==v){a[g.act]=v;rebuildTune();markDirty();updateTsum();}drawMap();}
function setupMapCanvas(){const cv=document.getElementById('mapcv');if(!cv)return;
  const g=cvSetup(cv,190);MAPUI.cv=cv;MAPUI.w=g.w;MAPUI.h=g.h;MAPUI.dpr=g.dpr;MAPUI.act=-1;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect(),x=e.clientX-r.left;
    let best=0,bd=1e9;for(let i=0;i<6;i++){const dd=Math.abs(mapX(i)-x);if(dd<bd){bd=dd;best=i;}}MAPUI.act=best;mapFromY(e.clientY-r.top);});
  cv.addEventListener('pointermove',e=>{if(MAPUI.act<0)return;mapFromY(e.clientY-cv.getBoundingClientRect().top);});
  const up=()=>{MAPUI.act=-1;drawMap();};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  drawMap();}
function drawMap(){const cv=MAPUI.cv;if(!cv||!cv.isConnected)return;
  const ctx=cv.getContext('2d'),g=MAPUI,w=g.w,h=g.h,d=MAPDEF[mapKind],a=TUNE.st.maps[mapKind];
  const Y=v=>g.pt+(d.max-v)/(d.max-d.min)*(h-g.pt-g.pb);
  const txt=G.light?'#10131a':'#f1f3f8',mut='#8a91a3',ln=G.light?'#c4cad7':'#2c303c';
  ctx.setTransform(g.dpr,0,0,g.dpr,0,0);ctx.clearRect(0,0,w,h);ctx.font='11px sans-serif';ctx.lineWidth=1;
  [d.min,0,d.max].forEach(v=>{ctx.setLineDash(v===0?[5,4]:[]);ctx.strokeStyle=ln;ctx.beginPath();ctx.moveTo(g.pl,Y(v));ctx.lineTo(w-g.pr,Y(v));ctx.stroke();
    ctx.fillStyle=mut;ctx.textAlign='right';ctx.fillText((v>0?'+':'')+v+d.u,g.pl-5,Y(v)+4);});
  ctx.setLineDash([]);
  for(let i=0;i<6;i++){ctx.strokeStyle=ln;ctx.beginPath();ctx.moveTo(mapX(i),g.pt);ctx.lineTo(mapX(i),h-g.pb);ctx.stroke();
    ctx.fillStyle=mut;ctx.textAlign='center';ctx.fillText((MAPBP[i]*preset.limit0/1000).toFixed(1)+'k',mapX(i),h-g.pb+15);}
  ctx.strokeStyle=d.col;ctx.lineWidth=2.5;ctx.beginPath();a.forEach((v,i)=>{i?ctx.lineTo(mapX(i),Y(v)):ctx.moveTo(mapX(i),Y(v));});ctx.stroke();
  const rpm=S.w*RPM;
  if(rpm>100){const u=rpm/preset.limit0;let f=0;
    if(u<=MAPBP[0])f=0;else if(u>=MAPBP[5])f=5;else for(let i=1;i<6;i++){if(u<=MAPBP[i]){f=i-1+(u-MAPBP[i-1])/(MAPBP[i]-MAPBP[i-1]);break;}}
    const cx=mapX(0)+f*(mapX(1)-mapX(0));ctx.strokeStyle='#ffb02e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,g.pt);ctx.lineTo(cx,h-g.pb);ctx.stroke();}
  a.forEach((v,i)=>{ctx.beginPath();ctx.arc(mapX(i),Y(v),9,0,TAU);ctx.fillStyle=g.act===i?d.col:(G.light?'#ffffff':'#13151c');ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle=d.col;ctx.stroke();ctx.fillStyle=txt;ctx.textAlign='center';
    ctx.fillText((v>0?'+':'')+v.toFixed(d.step<1?1:0),mapX(i),Y(v)-14);});}
function tuneLive(){if(tab==='tune'&&tsub==='ecu'&&sheet.classList.contains('show'))drawMap();}

/* ================= HUD + LOOP ================= */
const hudEl={rpm:el('rpm'),kmh:el('kmh'),bar:el('bar'),gbox:el('gbox'),pw:el('pw'),gbi:el('gbinfo'),fps:el('stFps'),load:el('stLoad'),flame:el('flame'),bS:el('bStart'),bT:el('bStop'),st:el('start')};
const hudLast={};function setT(k,node,v){if(hudLast[k]!==v){hudLast[k]=v;node.textContent=v;}}
const fmt=x=>(x<-0.005?'\u2212':'')+Math.abs(x).toFixed(2).replace('.',',');
let cutVis=0,fpsN=0,fpsT=0;
function hud(dt){
  const rpm=S.w*RPM;
  setT('rpm',hudEl.rpm,String(Math.round(rpm)));
  hudEl.rpm.parentNode.style.color=rpm>preset.limit-700?'#ff4b3e':rpm>4500?'#ffb02e':'#ff6a5e';
  setT('kmh',hudEl.kmh,String(Math.round(S.v*3.6)));
  setT('bar',hudEl.bar,fmt(S.map));
  const g=S.shift?S.shift.ng:S.gear;setT('gear',hudEl.gbox,g?String(g):'N');hudEl.gbox.classList.toggle('in',g>0);
  setT('pw',hudEl.pw,Math.round(S.tqOut)+' Nm · '+Math.round(S.tqOut*S.w/745.7)+' hp');
  if(G.gb){const ratio=S.gear?P.ratios[S.gear]:0,slip=S.gear?Math.abs(S.w-(S.wInShow||0))*RPM:0;
    setT('gbi',hudEl.gbi,(S.gear?'Gear '+S.gear+' · '+ratio.toFixed(2).replace('.',',')+':1':'Neutral')+' · clutch '+Math.round((S.gear?S.clEff:S.cl)*100)+'% · slip '+Math.round(slip)+' rpm');}
  if(rbLim!==preset.limit)rbSetup();
  const near=S.run&&rpm>=preset.limit-150,ph=((performance.now()/70)|0)&1;
  rfill.style.clipPath='inset(0 '+(100-clamp(rpm/RB_MAX*100,0,100)).toFixed(2)+'% 0 0)';
  rbar.classList.toggle('fl',near&&!!ph);
  if(S.cut>0)cutVis=0.15;else cutVis=Math.max(0,cutVis-dt);cutEl.classList.toggle('on',cutVis>0);
  hudEl.flame.classList.toggle('on',S.run&&((S.thr>0.9&&(S.map>0.4||rpm>5000))||(S.cut>0&&G.lim===2)||(G.pops&&A.popLvl>0.6&&S.thrE<0.05)||BF.any));
  setT('load',hudEl.load,'Load '+Math.round(S.thrE*100)+'%');tuneHud();
  const on=S.run;hudEl.st.classList.toggle('run',on);hudEl.bS.classList.toggle('act',!on);hudEl.bT.classList.toggle('act',on);
  fpsN++;fpsT+=dt;if(fpsT>0.6){setT('fps',hudEl.fps,Math.round(fpsN/fpsT)+' fps · '+Math.round(fpsT/fpsN*1000)+' ms');fpsN=0;fpsT=0;}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))return;dt=Math.min(dt,0.05);
  ['gas','brake'].forEach(k=>{if(keys[k])inp[k]=Math.min(1,inp[k]+dt*3.5);else if(!held[k])inp[k]=Math.max(0,inp[k]-dt*(k==='gas'?5:4));});
  S.thr+=(inp.gas-S.thr)*Math.min(1,dt*14);S.brk+=(inp.brake-S.brk)*Math.min(1,dt*14);
  if(mode==='garage'){S.gear=0;S.shift=null;S.v=0;S.brk=0;}
  const wasRun=S.run;
  tuneStep(dt);shiftStep(dt);autoShift(dt);physics(dt);
  if(mode==='garage')S.v=0;
  if(S.stalled){S.stalled=0;toast('Engine stalled');}
  if(!wasRun&&S.run)toast('Engine running');
  const rpm=S.w*RPM,bm=boostBar(rpm);
  const tgt=S.run?lerp(-0.62,bm,Math.pow(S.thrE,1.5)):(S.starting?-0.25:0);
  S.map+=(tgt-S.map)*(1-Math.exp(-dt/0.12));
  A.w=S.w;A.run=S.run;A.thr=S.thrE;A.thrRaw=S.thr;A.boost=Math.max(0,S.map);A.cut=S.cut>0;A.cutFrac=S.cutFrac;A.starting=S.starting;A.gear=S.gear;A.wIn=S.wInShow||0;A.v=S.v;backfireUpdate(dt);audioUpdate(dt);
  pedalDraw(pG,inp.gas);pedalDraw(pB,inp.brake);
  visuals(dt);if(window.CAR&&CAR.on){CAR.step(dt);renderer.render(CAR.scene,CAR.cam);}else{camUpdate(dt);renderer.render(scene,camera);}hud(dt);tuneLive();
}
loadTuneDB();applyPreset(TUNEDB.sel||0);applyGlass();applyTheme();renderSheet();
requestAnimationFrame(t=>{last=t;frame(t);});

</script>
